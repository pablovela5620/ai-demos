name: Build and Upload Packages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: linux-64, os: ubuntu-latest }
          - { target: linux-aarch64, os: ubuntu-latest }
          - { target: osx-arm64, os: macos-latest }
      fail-fast: false

    runs-on: ${{ matrix.os }}
    outputs:
      has-packages-linux-64: ${{ steps.check.outputs.has-packages }}
      has-packages-linux-aarch64: ${{ steps.check.outputs.has-packages }}
      has-packages-osx-arm64: ${{ steps.check.outputs.has-packages }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4

      - name: Build packages
        env:
          TARGET_PLATFORM: ${{ matrix.target }}
          RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION: true
          RATTLER_BUILD_COLOR: always
        run: |
          pixi run rattler-build build \
            -c https://prefix.dev/ai-demos -c conda-forge \
            --recipe-dir recipes/ \
            --skip-existing=all --no-test \
            --target-platform=$TARGET_PLATFORM

      - name: Check for packages
        id: check
        shell: bash
        run: |
          shopt -s nullglob
          files=(output/**/*.conda)
          if [ ${#files[@]} -gt 0 ]; then
            echo "has-packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-packages=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifacts
        if: steps.check.outputs.has-packages == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: packages-${{ matrix.target }}
          path: output/**/*.conda

  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        with:
          activate-environment: true

      - name: Download artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: output
          merge-multiple: true

      - name: Get JWT
        id: get_token
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const token = await core.getIDToken('prefix.dev')
            core.setOutput('token', token)

      - name: Mint the API Key on prefix.dev
        shell: bash
        run: |
          TOKEN="${{ steps.get_token.outputs.token }}"
          RESPONSE="$(curl -s -X POST                 \
              https://prefix.dev/api/oidc/mint_token \
              -H 'Content-Type: application/json'    \
              --data "{\"token\": \"$TOKEN\"}")"
          echo "::add-mask::$RESPONSE"
          echo "PREFIX_API_KEY=$RESPONSE" >> "$GITHUB_ENV"

      - name: Upload packages to ai-demos channel
        run: |
          shopt -s nullglob
          for file in output/**/*.conda; do
            rattler-build upload prefix -c ai-demos "$file" || true
          done
