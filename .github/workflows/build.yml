name: Build and Upload Packages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prebuilt_release:
        description: Temporary prerelease of tested Mac packages (macos-staging-<recipe SHA>)
        type: string
        default: ""
      prebuilt_manifest_sha256:
        description: SHA-256 of the release's SHA256SUMS file
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.prebuilt_release == ''
    strategy:
      matrix:
        # Validate macOS packages on the fleet Mac mini, not a hosted runner.
        include:
          - { target: linux-64, os: ubuntu-latest }
          - { target: linux-aarch64, os: ubuntu-24.04-arm }
      fail-fast: false

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6

      - name: Check workflow contract
        run: pixi run check

      - name: Test Blender MCP package
        # Test this package explicitly: the bulk build below uses --no-test.
        # Each target runs the MCP transport test before publishing can proceed.
        run: pixi run test-blender-package

      - name: Build packages
        env:
          TARGET_PLATFORM: ${{ matrix.target }}
          RATTLER_BUILD_ENABLE_GITHUB_INTEGRATION: true
          RATTLER_BUILD_COLOR: always
          # 13 so the cuda13 host env (lietorch 13.0 variant: pytorch-gpu 2.12
          # cuda130) resolves on the builder. 12.9 builds still resolve (their
          # cuda 12.9 deps only need __cuda >=12).
          CONDA_OVERRIDE_CUDA: "13"
        run: pixi run ci-build

      - name: Package the prebuilt Windows Beszel agent
        if: matrix.target == 'linux-64'
        run: pixi run ci-build-beszel-windows

      - name: Check package sizes
        # prefix.dev rejects any package file over 1 GiB (413); fail here, on PRs too,
        # instead of in the upload job after merge.
        run: pixi run check-package-size

      - name: Check for packages
        id: check
        shell: bash
        run: |
          first_file="$(find output -type f -name '*.conda' -print -quit)"
          if [ -n "$first_file" ]; then
            echo "has-packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-packages=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifacts
        if: github.event_name == 'push' && steps.check.outputs.has-packages == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: packages-${{ matrix.target }}
          path: output/**/*.conda
          retention-days: 1

  stage-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.prebuilt_release != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify prebuilt macOS packages
        env:
          GH_TOKEN: ${{ github.token }}
          PREBUILT_RELEASE: ${{ inputs.prebuilt_release }}
          MANIFEST_SHA256: ${{ inputs.prebuilt_manifest_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREBUILT_RELEASE" =~ ^macos-staging-[0-9a-f]{40}$ ]]
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          source_sha="${PREBUILT_RELEASE#macos-staging-}"
          git fetch --depth=1 origin "$source_sha"
          mkdir -p output/osx-arm64
          gh release download "$PREBUILT_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --dir output/osx-arm64 --pattern '*.conda' --pattern SHA256SUMS
          cd output/osx-arm64
          printf '%s  SHA256SUMS\n' "$MANIFEST_SHA256" | sha256sum --check -
          [[ $(wc -l < SHA256SUMS) -eq 5 ]]
          while read -r checksum filename; do
            [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]
            [[ "$filename" =~ ^[a-z0-9][a-zA-Z0-9_.-]*\.conda$ ]]
          done < SHA256SUMS
          [[ $(find . -maxdepth 1 -name '*.conda' | wc -l) -eq 5 ]]
          for package in paseo claude-code codex opencode ruler; do
            version="$(git show "$source_sha:recipes/$package/recipe.yaml" | sed -nE 's/^  version: "([^"]+)"$/\1/p' | head -1)"
            [[ -n "$version" ]]
            [[ $(find . -maxdepth 1 -name "$package-$version-*.conda" | wc -l) -eq 1 ]]
          done
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: packages-osx-arm64
          path: output/**/*.conda
          retention-days: 1

  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [build, stage-macos]
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.build.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.stage-macos.result == 'success'))
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          activate-environment: true

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: output
          merge-multiple: true

      - name: Get JWT
        id: get_token
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const token = await core.getIDToken('prefix.dev')
            core.setOutput('token', token)

      - name: Mint the API Key on prefix.dev
        shell: bash
        run: |
          TOKEN="${{ steps.get_token.outputs.token }}"
          RESPONSE="$(curl -s -X POST                 \
              https://prefix.dev/api/oidc/mint_token \
              -H 'Content-Type: application/json'    \
              --data "{\"token\": \"$TOKEN\"}")"
          echo "::add-mask::$RESPONSE"
          echo "PREFIX_API_KEY=$RESPONSE" >> "$GITHUB_ENV"

      - name: Upload packages to ai-demos channel
        shell: bash
        run: |
          if [ ! -d output ]; then
            echo "No packages to upload"
            exit 0
          fi
          first_file="$(find output -type f -name '*.conda' -print -quit)"
          if [ -z "$first_file" ]; then
            echo "No packages to upload"
            exit 0
          fi

          while IFS= read -r file; do
            rattler-build upload prefix -c ai-demos --skip-existing --verbose --log-style plain "$file"
          done < <(find output -type f -name '*.conda' | sort)

      - name: Verify packages via pixi search
        shell: bash
        run: |
          if [ ! -d output ]; then
            echo "No packages to verify"
            exit 0
          fi
          first_file="$(find output -type f -name '*.conda' -print -quit)"
          if [ -z "$first_file" ]; then
            echo "No packages to verify"
            exit 0
          fi

          while IFS= read -r file; do
            subdir="$(basename "$(dirname "$file")")"
            filename="$(basename "$file")"
            package_name="${filename%%-[0-9]*}"

            for attempt in {1..30}; do
              if pixi search "${package_name}" -c https://prefix.dev/ai-demos -p "${subdir}" | grep -F "${filename}" > /dev/null; then
                echo "Verified ${filename} via pixi search on ${subdir}"
                break
              fi

              if [ "$attempt" -eq 30 ]; then
                echo "Timed out waiting for ${filename} via pixi search on ${subdir}" >&2
                exit 1
              fi

              sleep 15
            done
          done < <(find output -type f -name '*.conda' | sort)
