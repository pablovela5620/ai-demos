name: Autobump

on:
  workflow_dispatch:
    inputs:
      package:
        description: Recipe to bump. Leave empty to check all recipes.
        required: false
        default: ""
  schedule:
    - cron: "0 5 * * 1"

permissions: {}

jobs:
  bump:
    name: ${{ matrix.recipe }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { recipe: playwright-cli, source: "npm:@playwright/cli" }
          - { recipe: paseo, source: "npm:@getpaseo/cli" }
          - { recipe: claude-code, source: "npm:@anthropic-ai/claude-code" }
          - { recipe: codex, source: "npm:@openai/codex" }
          - { recipe: splat-transform, source: "npm:@playcanvas/splat-transform" }
          - { recipe: ruler, source: "npm:@intellectronica/ruler" }
          # opencode 2.x ships only as GitHub releases; npm opencode-ai stays on 1.x.
          - { recipe: opencode, source: "github:anomalyco/opencode" }
          - { recipe: openwiki, source: "npm:openwiki" }
    permissions:
      actions: write # dispatch build.yml after the merge
      contents: write # push the bump branch and merge it
      pull-requests: write
    uses: ./.github/workflows/autobump-recipe.yml
    with:
      recipe: ${{ matrix.recipe }}
      source: ${{ matrix.source }}
      selected: ${{ github.event_name == 'schedule' || inputs.package == '' || inputs.package == matrix.recipe }}
