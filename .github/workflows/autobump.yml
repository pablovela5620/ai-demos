name: Autobump

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: Recipe to bump (blank = all)
        required: false
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC; agent-fleet pin-bump follows at 06:00

jobs:
  bump:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { recipe: playwright-cli, npm: "@playwright/cli" }
          - { recipe: paseo, npm: "@getpaseo/cli" }
          - { recipe: claude-code, npm: "@anthropic-ai/claude-code" }
          - { recipe: splat-transform, npm: "@playcanvas/splat-transform" }
    name: Bump ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Bump version
        id: bump
        if: github.event_name == 'schedule' || github.event.inputs.recipe == '' || github.event.inputs.recipe == matrix.recipe
        run: python3 .github/scripts/update-npm.py ${{ matrix.recipe }} ${{ matrix.npm }}

      - name: Create Pull Request
        id: pr
        if: steps.bump.outcome == 'success' && steps.bump.outputs.old-version != steps.bump.outputs.new-version
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ github.token }}
          title: Bump ${{ matrix.recipe }} from ${{ steps.bump.outputs.old-version }} to ${{ steps.bump.outputs.new-version }}
          commit-message: Bump ${{ matrix.recipe }} from ${{ steps.bump.outputs.old-version }} to ${{ steps.bump.outputs.new-version }}
          branch: bump-${{ matrix.recipe }}
          delete-branch: true
          body: |
            # ${{ matrix.recipe }}

            `${{ steps.bump.outputs.old-version }}` -> `${{ steps.bump.outputs.new-version }}`

            Source: npm `${{ matrix.npm }}`. Merging publishes to prefix.dev/ai-demos;
            the agent-fleet pin-bump picks it up from there.

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-operation == 'created'
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-url }}" || echo "auto-merge unavailable (enable in repo settings)"
        env:
          GH_TOKEN: ${{ github.token }}
