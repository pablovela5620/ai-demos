context:
  version: "0.42.0"

package:
  name: rerun-sdk
  version: ${{ version }}

source:
  url: https://github.com/rerun-io/rerun/archive/refs/tags/${{ version }}.tar.gz
  sha256: a8f4eda6af7d54c0a89762183eea9042d5e8c7d20eb4c574e0a9aca7990b463a
  patches:
    - rerun-0.42.0-av1-arm64.patch
    - rerun-0.42.0-proxy-slow-reader.patch

build:
  number: 0
  string: av1arm64_h${{ hash }}_${{ build_number }}
  skip: target_platform != "linux-aarch64"
  script: build.sh
  python:
    version_independent: true
    entry_points:
      - rerun = rerun_cli.__main__:main

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - rust ==1.98.1
    - rust-std-wasm32-unknown-unknown ==1.98.1
    - wasm-bindgen-cli ==0.2.129
    - cargo-bundle-licenses
    - binaryen
    - nodejs >=20.12,!=26.8.0
    - yarn
    - nasm
    - clang
    - llvm-tools
    - libprotobuf
    - pkg-config
    - cmake
    - make
  host:
    - python 3.11.*
    - python-abi3 3.11.*
    - maturin >=1.9.3,<2
    - python-build
    - python-installer
    - hatchling ==1.30.1
    - hatch-jupyter-builder ==0.9.1
    - anywidget
    - libudev <258
  run:
    - python >=3.11
    - attrs >=23.1.0
    - anywidget
    - jupyter-ui-poll
    - ipykernel !=7.0.*
    - numpy >=2
    - pillow >=8.0.0
    - psutil >=7.0
    - pyarrow >=18.0.0
    - typing_extensions >=4.5

tests:
  - python:
      imports:
        - rerun
        - rerun_bindings
        - rerun_notebook
      python_version: "3.11.*"
  - script:
      - rerun --version
      - rerun --version | grep 'Video features:.*av1'
      - rerun viewer-mcp --help
      - python -c "import rerun; assert rerun.__version__ == '0.42.0'"

about:
  homepage: https://rerun.io
  repository: https://github.com/rerun-io/rerun
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
    - THIRDPARTY.yml
  summary: Rerun SDK and viewer with native AV1 decoding on Linux ARM64
  description: |
    Temporary 0.42.0 source build with the native AV1 ARM64 fix for
    rerun-io/rerun#7755. Includes the Python SDK, native viewer, web viewer,
    and notebook integration. Remove this recipe once a released upstream
    version supports native AV1 on Linux ARM64.
