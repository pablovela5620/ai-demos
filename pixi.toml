[workspace]
channels = ["conda-forge"]
name = "ai-demos"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[tasks]
test-blender-package = "rattler-build build -c conda-forge --recipe recipes/mcp-for-blender/recipe.yaml --output-dir output-blender-tested"
check = { depends-on = ["test"] }
test = "pytest -q tests"
build-new = "rattler-build build -c https://prefix.dev/ai-demos -c conda-forge --recipe-dir recipes/ --skip-existing=all --no-test"
build-all = "rattler-build build -c https://prefix.dev/ai-demos -c conda-forge --recipe-dir recipes/ --no-test"
ci-build = "rattler-build build -c ./output -c https://prefix.dev/ai-demos -c conda-forge --recipe-dir recipes/ --variant-config conda_build_config.yaml --skip-existing=all --no-test --continue-on-failure --target-platform=$TARGET_PLATFORM --noarch-build-platform=linux-64"
ci-build-beszel-windows = "rattler-build build -c https://prefix.dev/ai-demos -c conda-forge --recipe recipes/beszel-agent/recipe.yaml --target-platform=win-64 --skip-existing=all --no-test"
# Build one recipe and run its tests on this machine's platform (autobump runs this before merging).
test-recipe = { cmd = "rattler-build build -c https://prefix.dev/ai-demos -c conda-forge --variant-config conda_build_config.yaml --recipe recipes/{{ recipe }}/recipe.yaml", args = ["recipe"] }
autobump = "python .github/scripts/autobump.py"
check-package-size = "python .github/scripts/check-package-size.py output"

[dependencies]
ca-certificates = ">=2026.10.19"
rattler-build = ">=0.58.4,<0.59"
python = "3.13.*"
pyyaml = "6.0.*"
pytest = ">=9.2.0,<10"
packaging = ">=26.3,<27"
pyserde = ">=0.35.0,<0.36"
tomli-w = ">=1.2.0,<2"
orjson = ">=3.13.0,<4"
