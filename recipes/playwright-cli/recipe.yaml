context:
  version: "0.1.25"

package:
  name: playwright-cli
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@playwright/cli/-/cli-${{ version }}.tgz
  sha256: 4559e4674cb5d10a03e0c15e9f5c892dcfa4f5d8703c49146594b4af322480f4

build:
  number: 1
  # Pure JavaScript (npm, no native parts, install scripts skipped): one package for every platform,
  # so the Linux CI publishes it for macOS too and no Mac build step is needed.
  noarch: generic
  script: build.sh

requirements:
  host:
    - nodejs >=18
  run:
    - nodejs >=18

tests:
  - package_contents:
      bin:
        - playwright-cli
  - script:
      - playwright-cli --version

about:
  homepage: https://github.com/microsoft/playwright-cli
  repository: https://github.com/microsoft/playwright-cli
  license: Apache-2.0
  license_file: LICENSE
  summary: Playwright command line interface for browser automation from agents and scripts
