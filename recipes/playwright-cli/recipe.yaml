context:
  version: "0.1.23"

package:
  name: playwright-cli
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@playwright/cli/-/cli-${{ version }}.tgz
  sha256: 70a706ca63b053dba5e0103d0d96758aee20ed916fe8b32721f886c99d0ec2f4

build:
  number: 0
  script: build.sh

requirements:
  host:
    - nodejs >=18
  run:
    - nodejs >=18

tests:
  - package_contents:
      bin:
        - playwright-cli
  - script:
      - playwright-cli --version

about:
  homepage: https://github.com/microsoft/playwright-cli
  repository: https://github.com/microsoft/playwright-cli
  license: Apache-2.0
  license_file: LICENSE
  summary: Playwright command line interface for browser automation from agents and scripts
