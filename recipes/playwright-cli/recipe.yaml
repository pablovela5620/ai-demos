context:
  version: "0.1.18"

package:
  name: playwright-cli
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@playwright/cli/-/cli-${{ version }}.tgz
  sha256: d847190000e3a3328a17ab71a52ccac8062fb2525c0f0c78b789aff1cc9ab37c

build:
  number: 0
  script: build.sh

requirements:
  host:
    - nodejs >=18
  run:
    - nodejs >=18

tests:
  - package_contents:
      bin:
        - playwright-cli
  - script:
      - playwright-cli --version

about:
  homepage: https://github.com/microsoft/playwright-cli
  repository: https://github.com/microsoft/playwright-cli
  license: Apache-2.0
  license_file: LICENSE
  summary: Playwright command line interface for browser automation from agents and scripts
