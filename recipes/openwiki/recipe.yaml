context:
  version: "0.6.0"

package:
  name: openwiki
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/openwiki/-/openwiki-${{ version }}.tgz
  sha256: 9af9d24f625fb2c4fd7ff9c0fcdf73847b41fe1627885d18b1d670b3dba831ff

build:
  number: 0
  script: build.sh

requirements:
  build:
    # better-sqlite3 can compile through node-gyp when no prebuilt binary is
    # available. The shared CI variant selects GCC for Linux/CUDA recipes,
    # but macOS uses the Xcode runner's clang toolchain.
    - if: linux
      then:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
    - make
    - python
  host:
    - nodejs >=22
  run:
    - nodejs >=22

tests:
  - package_contents:
      bin:
        - openwiki
  - script:
      - openwiki integrations list
      - node -e "const Database = require(process.env.PREFIX + '/lib/node_modules/openwiki/node_modules/better-sqlite3'); new Database(':memory:').close()"

about:
  homepage: https://github.com/langchain-ai/openwiki
  repository: https://github.com/langchain-ai/openwiki
  license: MIT
  license_file: LICENSE
  summary: CLI that generates and maintains agent documentation for a codebase
