context:
  version: "0.166.0"

package:
  name: codex
  version: ${{ version }}

# @openai/codex on npm is a 4KB JS shim whose optionalDependencies carry the
# real per-platform rust binaries (published as npm alias versions like
# 0.144.1-darwin-arm64). Repackage the platform vendor tree directly — no
# nodejs needed. Packaged here (not conda-forge, which rebuilds from source
# behind volunteer maintainers) because codex releases near-daily and agent
# CLIs need same-day bumps — same rationale as claude-code.
source:
  - if: target_platform == "osx-arm64"
    then:
      url: https://registry.npmjs.org/@openai/codex/-/codex-${{ version }}-darwin-arm64.tgz
      sha256: 181d2eda8addbeca0b689c996df207293947928bdd9c88a097837ae1c7e69ca5
  - if: target_platform == "linux-64"
    then:
      url: https://registry.npmjs.org/@openai/codex/-/codex-${{ version }}-linux-x64.tgz
      sha256: cbc00a26d3d0e2ceefc4be8891f8a81ef1e349b3b175bc0ae308762bc001fd93
  - if: target_platform == "linux-aarch64"
    then:
      url: https://registry.npmjs.org/@openai/codex/-/codex-${{ version }}-linux-arm64.tgz
      sha256: 9044e840397864fc6c539d13719b25fb26abb35d5353366cbabf7b4555406acd

build:
  number: 0
  script: build.sh
  dynamic_linking:
    binary_relocation: false
    missing_dso_allowlist:
      - "**"

requirements:
  run: []

tests:
  - package_contents:
      bin:
        - codex
      files:
        - etc/pixi/codex/global-ignore-conda-prefix
  - script:
      - codex --version

about:
  homepage: https://developers.openai.com/codex
  repository: https://github.com/openai/codex
  license: Apache-2.0
  license_file: LICENSE
  summary: OpenAI Codex CLI - coding agent that runs locally (repack of the official npm platform binaries)
