# rattler-build recipe for Pangolin
# C++ 3D visualization library with Python bindings (pypangolin).
# Used by DPVO for trajectory visualization.
package:
  name: pangolin
  version: "0.9.2"

source:
  url: https://github.com/stevenlovegrove/Pangolin/archive/refs/tags/v0.9.2.tar.gz
  sha256: 348f5c082d69afbb74b1af022d193cc0018ef8032a39409eb3f99c4ac2dd4b1e

build:
  number: 0
  skip:
    - target_platform != "linux-64"
  script: build.sh
  dynamic_linking:
    missing_dso_allowlist:
      - "*/libGL.so*"
      - "*/libGLX.so*"
      - "*/libEGL.so*"
      - "*/libX11.so*"
      - "*/libXext.so*"
      - "*/libpython3.11.so*"
      - "*/libc.so*"
      - "*/libm.so*"
      - "*/libgcc_s.so*"
      - "*/libstdc++.so*"
      - "*/ld-linux-*.so*"
      - "*/libpthread.so*"
      - "*/libdl.so*"
      - "*/librt.so*"
      - "*/libwayland*.so*"

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - python 3.11.*
    - pybind11
    - eigen >=3.4.0,<4
    - glew
    - libgl-devel
    - libegl-devel
    - libglvnd-devel
    - libopengl-devel
    - epoxy
    - xorg-libx11
    - xorg-libxext
    - xorg-libxrender
    - xorg-libxfixes
    - libpng
    - libjpeg-turbo
    - wayland
  run:
    - python 3.11.*

tests:
  - python:
      imports:
        - pypangolin

about:
  homepage: https://github.com/stevenlovegrove/Pangolin
  license: MIT
  summary: Lightweight 3D visualization library with Python bindings
  repository: https://github.com/stevenlovegrove/Pangolin
