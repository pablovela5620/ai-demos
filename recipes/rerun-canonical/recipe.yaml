# rerun-canonical: the stock rerun command line with every examples-monorepo viewer extension
# (packages/canonical-viewer). Built on our own machines with that package's recipe (linux-64 on the 5090 box,
# linux-aarch64 on the Spark, osx-arm64 on the Mac mini); this recipe repackages the three binaries from the release
# below. osx-arm64 is published through the macOS staging job.
context:
  version: "0.44.0"
  # examples-monorepo commit the binaries were built from; the release is rerun-canonical-<version>-<commit>.
  commit: "COMMIT7"
  release: https://github.com/pablovela5620/ai-demos/releases/download/rerun-canonical-${{ version }}-${{ commit }}

package:
  name: rerun-canonical
  version: ${{ version }}

source:
  - if: target_platform == "linux-64"
    then:
      url: ${{ release }}/rerun-canonical-${{ version }}-${{ commit }}-linux-64.tar.gz
      sha256: SHA256_LINUX_64
  - if: target_platform == "linux-aarch64"
    then:
      url: ${{ release }}/rerun-canonical-${{ version }}-${{ commit }}-linux-aarch64.tar.gz
      sha256: SHA256_LINUX_AARCH64
  - if: target_platform == "osx-arm64"
    then:
      url: ${{ release }}/rerun-canonical-${{ version }}-${{ commit }}-osx-arm64.tar.gz
      sha256: SHA256_OSX_ARM64

build:
  # The examples-monorepo recipe's build number (raised for every extension or patch change at one Rerun tag).
  number: 1
  string: canonical_${{ commit }}_${{ build_number }}
  skip: target_platform not in ["linux-64", "linux-aarch64", "osx-arm64"]
  script:
    - install -d "$PREFIX/bin"
    - install -m 755 bin/rerun-canonical "$PREFIX/bin/rerun-canonical"
  dynamic_linking:
    missing_dso_allowlist:
      - "*/libSystem.B.dylib"
      - "*/libobjc.A.dylib"
      - "*/libc.so*"
      - "*/libm.so*"
      - "*/libdl.so*"
      - "*/libpthread.so*"
      - "*/librt.so*"
      - "*/ld-linux-*.so*"

requirements:
  # The run dependencies of the examples-monorepo build; winit loads the X11 and Wayland libraries at run time (dlopen).
  run:
    - if: linux
      then:
        - libgcc >=16
        - libstdcxx >=16
        - libudev1 >=257.13
        - libxkbcommon
        - wayland
        - xorg-libx11
        - xorg-libxcursor
        - xorg-libxi
        - xorg-libxinerama
        - xorg-libxrandr
        - __glibc >=2.17
    - if: osx
      then: __osx >=11.0

tests:
  - script:
      - rerun-canonical --version
      - rerun-canonical mcp --help

about:
  homepage: https://github.com/rerun-io/examples-monorepo/tree/main/packages/canonical-viewer
  summary: The canonical Rerun viewer, rerun-canonical (the stock rerun command line with every viewer extension)
