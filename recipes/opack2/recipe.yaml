context:
  version: "0.2.0"

package:
  name: opack2
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/22/02/f79f07f275aadb157361cc977629975ee936572140ce3a33715dbd6fc08e/opack2-0.2.0.tar.gz
  sha256: 997ab3fe4540610f10c8072a34fa69246c229b5e2bbf3f383cbe6f2884cbf1a4
  patches:
    - remove-missing-cli.patch

build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -v

requirements:
  host:
    - python 3.13.*
    - pip
    - setuptools >=43.0.0
    - wheel
  run:
    - python >=3.13,<3.14
    - arrow
    - bytestruct >=0.1.0

tests:
  - python:
      imports:
        - opack2
      python_version: 3.13.*

about:
  homepage: https://pypi.org/project/opack2/
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: "Python library for parsing the opack format"
