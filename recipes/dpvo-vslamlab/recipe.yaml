# rattler-build recipe for dpvo-vslamlab
# Adapted from VSLAM-LAB/conda-packages for CUDA 12.9 + PyTorch 2.10.
# Uses ${{ compiler('cuda') }} + ${{ stdlib('c') }} for proper sysroot
# setup (needed because DPViewer uses raw cmake + find_package(Torch)).
context:
  name: dpvo-vslamlab
  version: "1.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/VSLAM-LAB/DPVO-VSLAM-LAB
  rev: 5a767667bb3ac00025d7279218bb5088fe5c7c9f

build:
  number: 1
  skip:
    - target_platform != "linux-64"
  script: build.sh
  dynamic_linking:
    missing_dso_allowlist:
      - "*/libcuda.so*"
      - "*/libcudart.so*"
      - "*/libc10.so*"
      - "*/libc10_cuda.so*"
      - "*/libtorch.so*"
      - "*/libtorch_cpu.so*"
      - "*/libtorch_cuda.so*"
      - "*/libtorch_python.so*"
      - "*/libpython3.11.so*"
      - "*/libc.so*"
      - "*/libm.so*"
      - "*/libgcc_s.so*"
      - "*/libstdc++.so*"
      - "*/ld-linux-*.so*"
      - "*/libgomp.so*"
      - "*/libGL.so*"
      - "*/libEGL.so*"
      - "*/libX11.so*"

requirements:
  # Don't propagate CUDA toolkit / X11 / OpenGL run_exports to run deps.
  # DPViewer links against PyTorch's CUDA libs, not directly against the toolkit.
  ignore_run_exports:
    by_name:
      - cuda-cudart
      - cuda-nvrtc
      - cudnn
      - libcublas
      - libcufft
      - libcurand
      - libcufile
      - libcusparse
      - libcusolver
      - libcudss
      - cusparselt
      - libnvjitlink
      - libgl
      - libegl
      - libglvnd
      - libopengl
      - glew
      - wayland
      - xorg-libx11
      - xorg-libxext
      - xorg-libxfixes
      - xorg-libxrender
      - xorg-libice
      - xorg-libsm
      - xorg-libxdmcp
      - xorg-libxau
      - libxkbcommon
  build:
    - ${{ compiler('cuda') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ninja
    - cmake <4
    - make
    - pkg-config
  host:
    - python 3.11.*
    - setuptools
    - pip
    - pybind11
    # CUDA Toolkit (version locked by compiler('cuda') variant)
    - cuda-version ==${{ cuda_compiler_version }}
    - cuda-cudart-dev
    - cuda-crt
    - cuda-nvrtc-dev
    - cuda-driver-dev
    - cuda-nvml-dev
    - cuda-profiler-api
    - cudnn
    - libcublas-dev
    - libcufft-dev
    - libcurand-dev
    - libcufile-dev
    - libcusparse-dev
    - libcusolver-dev
    - libcudss-dev
    - cusparselt
    - libnvjitlink
    # X11 + OpenGL (needed for DPViewer pybind11 build)
    - libgl-devel
    - libegl-devel
    - libglvnd-devel
    - libopengl-devel
    - xorg-libxext
    - xorg-libx11
    - xorg-libxfixes
    - xorg-libxrender
    - xorg-libice
    - xorg-libsm
    - xorg-libxdmcp
    - xorg-libxau
    - xorg-xorgproto
    - libxkbcommon
    - glew
    - wayland
    # Compile-time deps
    - pangolin
    - pytorch-gpu >=2.8.0
    - torchvision
    - eigen
    - numpy
    - opencv
  run:
    - python 3.11.*
    - pytorch-gpu >=2.8.0
    - torchvision
    - pytorch_scatter
    - opencv
    - evo
    - yacs
    - einops
    - numba
    - pangolin
    - pypose

tests:
  - python:
      imports:
        - dpvo

about:
  license: MIT
  summary: Deep Patch Visual Odometry/SLAM
  homepage: https://github.com/princeton-vl/DPVO
  repository: https://github.com/VSLAM-LAB/DPVO-VSLAM-LAB
