# Variant configuration for ai-demos conda packages.
#
# Adapted from VSLAM-LAB/conda-packages conda_build_config.yaml.
# Primary target: linux-64 with CUDA 12.9.
#
# This file is used by rattler-build to resolve ${{ compiler() }},
# ${{ stdlib() }}, and variant variables like cuda_compiler_version.

# ── C / C++ compilers ──────────────────────────────────────────────────────────
c_compiler:
  - gcc
c_compiler_version:
  - 13

cxx_compiler:
  - gxx
cxx_compiler_version:
  - 13

fortran_compiler:
  - gfortran
fortran_compiler_version:
  - 13

# ── C standard library (sysroot) ──────────────────────────────────────────────
c_stdlib:
  - sysroot
c_stdlib_version:
  - 2.17

# ── CUDA compiler ─────────────────────────────────────────────────────────────
# ${{ compiler('cuda') }} expands to cuda-nvcc_linux-64 with this version.
# Recipes that use this skip non-linux-64 via: skip: target_platform != "linux-64"
cuda_compiler:
  - cuda-nvcc
cuda_compiler_version:
  - "12.9"

# ── Variant matrix control ─────────────────────────────────────────────────────
zip_keys:
  -
    - c_compiler_version
    - cxx_compiler_version
    - fortran_compiler_version
    - cuda_compiler
    - cuda_compiler_version

# ── Python ─────────────────────────────────────────────────────────────────────
python:
  - "3.11"
