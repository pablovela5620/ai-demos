context:
  version: "0.3.9"

package:
  name: pmd-pytcp
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/f0/2f/829508adca9d96ccb07030dbeb661b5748a1e234e0873b365341067fa83b/pmd_pytcp-0.3.9.tar.gz
  sha256: 6429509ac8ba45ba17dee12e14c3d06d7bbadd5c12f0d6d4a961bf4bafe19ca5

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - pytcpd = pmd_pytcp.daemon.__main__:main
  script: python -m pip install . --no-deps --no-build-isolation -v

requirements:
  host:
    - python 3.13.*
    - pip
    - setuptools >=61.0
  run:
    - python >=3.13,<3.14
    - pmd-net-addr ==0.0.3
    - pmd-net-proto ==0.0.3
    - typing_extensions >=4.6

tests:
  - python:
      imports:
        - pmd_pytcp
      python_version: 3.13.*
  - script:
      - pytcpd --help

about:
  homepage: https://pypi.org/project/pmd-pytcp/
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: "Pure-Python, zero-dependency TCP/IP stack \u2014 Ethernet through RFC 9293 TCP \u2014 running in user space on a TAP/TUN interface, embeddable in-process or run as a daemon, with a Berkeley-sockets API."
