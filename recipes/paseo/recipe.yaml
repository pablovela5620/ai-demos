context:
  version: "0.6.1"

package:
  name: paseo
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@getpaseo/cli/-/cli-${{ version }}.tgz
  sha256: 0561419f340daf3e6d496bd5e6755532f671158634597f699a859d08a2066daa

build:
  number: 0
  script: build.sh
  dynamic_linking:
    binary_relocation: false
    missing_dso_allowlist:
      - "*/libSystem.B.dylib"
      - "*/libobjc.A.dylib"
      - "*/libc++*.dylib"
      - "*/libc.so*"
      - "*/libm.so*"
      - "*/libdl.so*"
      - "*/libpthread.so*"
      - "*/ld-linux-*.so*"
      - "*/libstdc++.so*"
      - "*/libgcc_s.so*"
      - "*/libutil.so*"

requirements:
  build:
    # node-pty (transitive dep of @getpaseo/server) compiles via node-gyp at
    # install time, so scripts must run and a toolchain must be present.
    # On osx the shared variant config pins gcc (linux/CUDA-centric), which
    # doesn't exist for osx-arm64 — node-gyp uses the Xcode CLT clang there.
    - if: linux
      then:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
    - make
    - python 3.12.*
  host:
    - nodejs >=20
  run:
    - nodejs >=20

tests:
  - package_contents:
      bin:
        - paseo
  - script:
      - paseo --version

about:
  homepage: https://paseo.sh
  repository: https://github.com/getpaseo/paseo
  license: AGPL-3.0-only
  license_file: LICENSE
  summary: Paseo daemon and CLI - run coding agents on your machine and drive them from mobile, desktop, web, or terminal clients
