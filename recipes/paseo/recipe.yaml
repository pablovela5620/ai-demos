context:
  version: "0.15.4"

package:
  name: paseo
  # Conda package versions cannot keep npm's prerelease hyphen.
  version: ${{ version | replace("-beta.", "b") }}

source:
  - url: https://registry.npmjs.org/@getpaseo/cli/-/cli-${{ version }}.tgz
    sha256: fd31167cede41c6a789b0d634dc9e9176d5f1ccc872cd7c698829c49eb0715d1
  - url: https://raw.githubusercontent.com/getpaseo/paseo/v${{ version }}/LICENSE
    sha256: 79d5aedce6aa0adc547336dc1bd34c5cc9308ba110fac7079ed97515ee573ad3

build:
  number: 0
  script: build.sh
  dynamic_linking:
    binary_relocation: false
    missing_dso_allowlist:
      - "*/libSystem.B.dylib"
      - "*/libobjc.A.dylib"
      - "*/libc++*.dylib"
      - "*/libc.so*"
      - "*/libm.so*"
      - "*/libdl.so*"
      - "*/libpthread.so*"
      - "*/ld-linux-*.so*"
      - "*/libstdc++.so*"
      - "*/libgcc_s.so*"
      - "*/libutil.so*"

requirements:
  build:
    # node-pty (transitive dep of @getpaseo/server) compiles via node-gyp at
    # install time, so scripts must run and a toolchain must be present.
    # On osx the shared variant config pins gcc (linux/CUDA-centric), which
    # doesn't exist for osx-arm64 — node-gyp uses the Xcode CLT clang there.
    - if: linux
      then:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
    - make
    - python 3.12.*
  host:
    - nodejs >=20
  run:
    - nodejs >=20

tests:
  - package_contents:
      bin:
        - paseo
  - script:
      - paseo --version

about:
  homepage: https://paseo.sh
  repository: https://github.com/getpaseo/paseo
  license: Apache-2.0
  license_file: LICENSE
  summary: Paseo daemon and CLI - run coding agents on your machine and drive them from mobile, desktop, web, or terminal clients
