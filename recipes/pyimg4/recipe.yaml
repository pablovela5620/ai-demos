context:
  version: "0.8.8"

package:
  name: pyimg4
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/3c/5c/69bad79b4e9d7be46063e9ea15e82c79ae0dec90811501453003588aab62/pyimg4-0.8.8.tar.gz
  sha256: aafebb2bc7922f6cf551b1b9e982d2da039cbeb08f0a2e2048a1818d51c76da1

build:
  number: 0
  skip: target_platform != "osx-arm64"
  python:
    entry_points:
      - pyimg4 = pyimg4.__main__:cli
  script: python -m pip install . --no-deps --no-build-isolation -v

requirements:
  host:
    - python 3.13.*
    - pip
    - hatchling
    - uv-dynamic-versioning
  run:
    - python >=3.13,<3.14
    - apple-compress >=0.2.3
    - asn1 <3.0.0
    - asn1 >=2.7.0
    - click >=8.1.7
    - pycryptodome >=3.18.0
    - pylzss ==0.3.4

tests:
  - python:
      imports:
        - pyimg4
      python_version: 3.13.*
  - script:
      - pyimg4 --help

about:
  homepage: https://pypi.org/project/pyimg4/
  license: MIT
  license_file: LICENSE
  summary: "A Python library/CLI tool for parsing Apple's Image4 format."
