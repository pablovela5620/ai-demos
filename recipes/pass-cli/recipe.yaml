context:
  version: "2.3.3"

package:
  name: pass-cli
  version: ${{ version }}

# Official stable binaries and SHA256 hashes from:
# https://proton.me/download/pass-cli/versions.json
source:
  - if: target_platform == "linux-64"
    then:
      url: https://proton.me/download/pass-cli/${{ version }}/pass-cli-linux-x86_64
      sha256: b5b49a8b3fd0af8830c0c1979f28ea0c90ccece73f59023a8bca8245d4b68da9
      file_name: pass-cli
  - if: target_platform == "linux-aarch64"
    then:
      url: https://proton.me/download/pass-cli/${{ version }}/pass-cli-linux-aarch64
      sha256: 9c3e85e10d3bb631ffe377f063d996b9cc9a545d30971bcedf5910e16d03542b
      file_name: pass-cli
  - if: target_platform == "osx-arm64"
    then:
      url: https://proton.me/download/pass-cli/${{ version }}/pass-cli-macos-aarch64
      sha256: 3281587ac9c50ae2f1604ba75e9d1d39b6debb221b65a6cc56f64d626ede3dbc
      file_name: pass-cli
  - url: https://raw.githubusercontent.com/protonpass/pass-cli/51a4c9b110a0ffe6e81f4f5d3877b9e5a0c24112/LICENSE
    sha256: c7900f97f653a7f70ff78acd49d25078807c60eec1cc860df23b9f44043977ba

build:
  number: 0
  skip: target_platform not in ["linux-64", "linux-aarch64", "osx-arm64"]
  script:
    - mkdir -p "$PREFIX/bin"
    - install -m 755 pass-cli "$PREFIX/bin/pass-cli"
  dynamic_linking:
    binary_relocation: false

requirements:
  run:
    - if: linux
      then: __glibc >=2.30
    - if: target_platform == "linux-64"
      then: libgcc
    - if: osx
      then: __osx >=11.0

tests:
  - package_contents:
      bin:
        - pass-cli
  - script:
      - pass-cli --version
      - pass-cli --help

about:
  homepage: https://protonpass.github.io/pass-cli/
  repository: https://github.com/protonpass/pass-cli
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Official command-line interface for Proton Pass
