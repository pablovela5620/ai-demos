context:
  version: "0.30.2"

package:
  name: rerun-gs-viewer
  version: ${{ version }}

source:
  url: https://github.com/pablovela5620/rerun-simple-gs/archive/9679cb7be941b3d3e4b02a87046a31bda9232865.tar.gz
  sha256: 9a9e8b1cadc3394843a6372548058a9805b4c0b4cd1e5fb110de7b8c0d5dfbe0

build:
  number: 0
  script: build.sh
  dynamic_linking:
    missing_dso_allowlist:
      - "*/libSystem.B.dylib"
      - "*/libobjc.A.dylib"
      - "*/libc.so*"
      - "*/libm.so*"
      - "*/libdl.so*"
      - "*/libpthread.so*"
      - "*/ld-linux-*.so*"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - if: linux
      then:
        - libxkbcommon
        - wayland
        - xorg-libx11
        - xorg-libxcursor
        - xorg-libxi
        - xorg-libxinerama
        - xorg-libxrandr
  run:
    - if: osx
      then:
        - __osx >=11.0
    - if: linux
      then:
        - libxkbcommon
        - wayland
        - xorg-libx11
        - xorg-libxcursor
        - xorg-libxi
        - xorg-libxinerama
        - xorg-libxrandr
        - __glibc >=2.17

tests:
  - package_contents:
      bin:
        - rerun-gs-viewer
  - script:
      - test -x $PREFIX/bin/rerun-gs-viewer
      - rerun-gs-viewer --version

about:
  homepage: https://github.com/pablovela5620/rerun-simple-gs
  repository: https://github.com/pablovela5620/rerun-simple-gs
  summary: Stock Rerun viewer with a Gaussian splat visualizer extension
  description: |
    Native Rerun viewer binary with the Gaussian splat visualizer extension
    from rerun-simple-gs.
