context:
  version: "0.0.3"
package:
  name: enum-compat
  version: ${{ version }}
source:
  url: https://files.pythonhosted.org/packages/41/46/8ed2368976d934652d8f33f1fdd86f5580fab45e890c90a848e83097a093/enum-compat-0.0.3.tar.gz
  sha256: 3677daabed56a6f724451d585662253d8fb4e5569845aafa8bb0da36b1a8751e
build:
  number: 8
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -v
requirements:
  host:
    - python 3.13.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.10
tests:
  - python:
      imports:
        - enum
      python_version: 3.13.*
about:
  homepage: https://github.com/jstasiak/enum-compat
  license: MIT
  summary: Enum compatibility metadata package; uses the standard library on Python 3
