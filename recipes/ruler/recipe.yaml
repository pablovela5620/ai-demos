context:
  version: "0.3.46"

package:
  name: ruler
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@intellectronica/ruler/-/ruler-${{ version }}.tgz
  sha256: 1f56209ff25b9d07c118fb74061804711e5d23665bcd67573025fc6220c44366

build:
  number: 0
  script: build.sh

requirements:
  host:
    - nodejs >=18
  run:
    - nodejs >=18

tests:
  - package_contents:
      bin:
        - ruler
  - script:
      - ruler --version

about:
  homepage: https://github.com/intellectronica/ruler
  repository: https://github.com/intellectronica/ruler
  license: MIT
  license_file: LICENSE
  summary: Centralise AI coding assistant instructions and MCP config - one source distributed to per-agent formats
