context:
  version: "2.0.1"

package:
  name: asgiwebdav
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/55/70/d14d53453f00a7a9c1d187a4abe5b01bb8a7f837f7eabbbb3968613b93ef/asgiwebdav-2.0.1.tar.gz
  sha256: 4bcb0cdb05661db79fa1af73184fde4de6f81ff2ecb6c8716b5ba182ef7d4460

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - asgi-webdav = asgi_webdav.cli:main
  script: python -m pip install . --no-deps --no-build-isolation -v

requirements:
  host:
    - python 3.13.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >=3.13,<3.14
    - asgiref
    - aiofiles >=25.1.0
    - asgimiddlewarestaticfile >=0.7.0
    - xmltodict ~=1.0.2
    - dataclass-wizard !=0.37.0,<1.0,>=0.36.6
    - python-dotenv
    - backports.zstd
    - uvicorn

    - chardet
    - click

tests:
  - python:
      imports:
        - asgi_webdav
      python_version: 3.13.*
  - script:
      - asgi-webdav --help

about:
  homepage: https://pypi.org/project/asgiwebdav/
  license: MIT
  license_file: LICENSE
  summary: "An asynchronous WebDAV server implementation, support multi-provider."
