context:
  version: "2.2.6"

package:
  name: opencode
  version: ${{ version }}

# Repack official release binaries. Version 2 is not published under the
# version 1 npm package names. Keep the Linux ARM64 glibc loader check.
source:
  - if: target_platform == "osx-arm64"
    then:
      url: https://github.com/anomalyco/opencode/releases/download/v${{ version }}/opencode-darwin-arm64.zip
      sha256: 15491608f6b0bc4debe5eac35eab629a2b07ea9a1fbac68ad53bcea59fcc4b45
  - if: target_platform == "linux-64"
    then:
      url: https://github.com/anomalyco/opencode/releases/download/v${{ version }}/opencode-linux-x64.tar.gz
      sha256: 08bb21d6326ce740d91cce7ebe88a6536933f6e1e30353b91a06b01f25da306c
  - if: target_platform == "linux-aarch64"
    then:
      url: https://github.com/anomalyco/opencode/releases/download/v${{ version }}/opencode-linux-arm64.tar.gz
      sha256: f2d27600c367e45057d6a16f6a5c2aa8d77b41a9b10d4bc3d849c2f88870e944

build:
  number: 1  # autobump: preserve-build-number
  script: build.sh
  dynamic_linking:
    binary_relocation: false
    missing_dso_allowlist:
      - "**"

requirements:
  run: []

tests:
  - package_contents:
      bin:
        - opencode
  - script:
      - opencode --version

about:
  homepage: https://opencode.ai
  repository: https://github.com/anomalyco/opencode
  license: MIT
  summary: Open source coding agent
