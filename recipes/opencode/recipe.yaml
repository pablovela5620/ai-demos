context:
  version: "1.18.13"

package:
  name: opencode
  version: ${{ version }}

# Repack the official npm platform binaries. The linux-arm64 package is the
# glibc build; this is deliberate because the github-releases conda package
# currently selects opencode-linux-arm64-musl on glibc systems.
source:
  - if: target_platform == "osx-arm64"
    then:
      url: https://registry.npmjs.org/opencode-darwin-arm64/-/opencode-darwin-arm64-${{ version }}.tgz
      sha256: c8c821a730c56d64004dbbb114896ec9c960bd211403e19a481399c4e8c0eb0d
  - if: target_platform == "linux-64"
    then:
      url: https://registry.npmjs.org/opencode-linux-x64/-/opencode-linux-x64-${{ version }}.tgz
      sha256: 9d2aac9f7828e96b616551c60be25bd71b8452dc917294396707a8e71948aa7e
  - if: target_platform == "linux-aarch64"
    then:
      url: https://registry.npmjs.org/opencode-linux-arm64/-/opencode-linux-arm64-${{ version }}.tgz
      sha256: dfe4242314f616fb49a741089e587760bcc22538c28566c65825631434c12855

build:
  number: 0
  script: build.sh
  dynamic_linking:
    binary_relocation: false
    missing_dso_allowlist:
      - "**"

requirements:
  run: []

tests:
  - package_contents:
      bin:
        - opencode
  - script:
      - opencode --version

about:
  homepage: https://opencode.ai
  repository: https://github.com/anomalyco/opencode
  license: MIT
  summary: Open source coding agent
