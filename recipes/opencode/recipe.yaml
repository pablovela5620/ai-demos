context:
  version: "1.19.4"

package:
  name: opencode
  version: ${{ version }}

# Repack official platform binaries. The npm linux-arm64 package unexpectedly
# requires /lib/ld-musl-aarch64.so.1, so use the upstream glibc release asset.
source:
  - if: target_platform == "osx-arm64"
    then:
      url: https://registry.npmjs.org/opencode-darwin-arm64/-/opencode-darwin-arm64-${{ version }}.tgz
      sha256: 79e4e8fc2b461d9ed2141a41b128b82120b590ff50276878a6ae3ab26c2fa12b
  - if: target_platform == "linux-64"
    then:
      url: https://registry.npmjs.org/opencode-linux-x64/-/opencode-linux-x64-${{ version }}.tgz
      sha256: dca7b06bbb4e4a1ab3681b799cd328057b356d9399e8e47336cf53b7ae658d0d
  - if: target_platform == "linux-aarch64"
    then:
      url: https://github.com/anomalyco/opencode/releases/download/v${{ version }}/opencode-linux-arm64.tar.gz
      sha256: 8568230ccd847dc93e95b9f6894379077d3e014a16b48040743573e77c23e85f

build:
  number: 1  # autobump: preserve-build-number
  script: build.sh
  dynamic_linking:
    binary_relocation: false
    missing_dso_allowlist:
      - "**"

requirements:
  run: []

tests:
  - package_contents:
      bin:
        - opencode
  - script:
      - opencode --version

about:
  homepage: https://opencode.ai
  repository: https://github.com/anomalyco/opencode
  license: MIT
  summary: Open source coding agent
