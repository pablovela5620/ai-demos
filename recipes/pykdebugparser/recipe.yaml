context:
  version: "1.10.0"

package:
  name: pykdebugparser
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/13/77/fc89236fb1d87cafe5d822f55b4d12bdbf291743b496041f37923ffc8aeb/pykdebugparser-1.10.0.tar.gz
  sha256: d21c95d25e36e53b0a0542233bedfec68adf9e8f170bdf3da992e3837664263e

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - pykdebugparser = pykdebugparser.__main__:cli
  script: python -m pip install . --no-deps --no-build-isolation -v

requirements:
  host:
    - python 3.13.*
    - pip
    - setuptools >=43.0.0
    - setuptools-scm >=8
    - wheel
  run:
    - python >=3.13,<3.14
    - bytestruct >=0.1.0
    - click
    - termcolor

tests:
  - python:
      imports:
        - pykdebugparser
      python_version: 3.13.*
  - script:
      - pykdebugparser --help

about:
  homepage: https://pypi.org/project/pykdebugparser/
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: "Python parser for kdebug events"
