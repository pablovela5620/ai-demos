context:
  version: "0.19.0"

package:
  name: beszel-hub
  version: ${{ version }}

source:
  git: https://github.com/henrygd/beszel.git
  rev: ffcdb041670a501611727848649d28d886beb231
  patches:
    - patches/gpu-overview.patch

build:
  number: 1
  skip: target_platform != "linux-64"
  script: build.sh
  dynamic_linking:
    binary_relocation: false

requirements:
  build:
    - go ==1.27.1
    - bun ==1.3.11
    - nodejs 24.*

tests:
  - package_contents:
      bin:
        - beszel
  - script:
      - beszel --version

about:
  homepage: https://beszel.dev
  repository: https://github.com/henrygd/beszel
  license: MIT
  license_file: LICENSE
  summary: Beszel monitoring Hub with the fleet GPU overview patch
