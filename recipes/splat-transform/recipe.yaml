context:
  version: "3.3.3"

package:
  name: splat-transform
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@playcanvas/splat-transform/-/splat-transform-${{ version }}.tgz
  sha256: 98e5aeabcf6337027c29b98366b99e37305c8acc204ef118fd0467d3c41be5bc

build:
  number: 0
  script: build.sh
  dynamic_linking:
    binary_relocation: false
    missing_dso_allowlist:
      - "*/libSystem.B.dylib"
      - "*/libobjc.A.dylib"
      - "*/libc.so*"
      - "*/libm.so*"
      - "*/libdl.so*"
      - "*/libpthread.so*"
      - "*/ld-linux-*.so*"
      - "*/libstdc++.so*"
      - "*/libgcc_s.so*"
      - "*/libX11.so*"
      - "*/libX11-xcb.so*"
      - "*/libxcb.so*"
      - "*/libXrandr.so*"
      - "*/libXinerama.so*"
      - "*/libXcursor.so*"
      - "*/libXi.so*"
      - "*/libvulkan.so*"

requirements:
  host:
    - nodejs >=22
  run:
    - nodejs >=22
    - if: osx
      then:
        - __osx >=11.0
    - if: linux
      then:
        - __glibc >=2.17

tests:
  - package_contents:
      bin:
        - splat-transform
  - script:
      - splat-transform --version 2>&1 | grep -F "splat-transform v${{ version }} ("

about:
  homepage: https://github.com/playcanvas/splat-transform
  repository: https://github.com/playcanvas/splat-transform
  license: MIT
  license_file: LICENSE
  summary: CLI tool for 3D Gaussian splat format conversion and transformation
