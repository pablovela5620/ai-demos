context:
  version: "1.9.2"

package:
  name: splat-transform
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@playcanvas/splat-transform/-/splat-transform-${{ version }}.tgz
  sha256: f71d4955c24335baae37d51cfda1c79fe18c405d424db33d8c4752d2b8a99a41

build:
  number: 0
  script: build.sh
  skip:
    - target_platform == "linux-aarch64"
  dynamic_linking:
    binary_relocation: false
    missing_dso_allowlist:
      - "*/libSystem.B.dylib"
      - "*/libobjc.A.dylib"
      - "*/libc.so*"
      - "*/libm.so*"
      - "*/libdl.so*"
      - "*/libpthread.so*"
      - "*/ld-linux-*.so*"
      - "*/libstdc++.so*"
      - "*/libgcc_s.so*"
      - "*/libX11.so*"
      - "*/libX11-xcb.so*"
      - "*/libxcb.so*"
      - "*/libXrandr.so*"
      - "*/libXinerama.so*"
      - "*/libXcursor.so*"
      - "*/libXi.so*"
      - "*/libvulkan.so*"

requirements:
  host:
    - nodejs >=18
  run:
    - nodejs >=18
    - if: osx
      then:
        - __osx >=11.0
    - if: linux
      then:
        - __glibc >=2.17

tests:
  - package_contents:
      bin:
        - splat-transform
  - script:
      - splat-transform --version

about:
  homepage: https://github.com/playcanvas/splat-transform
  repository: https://github.com/playcanvas/splat-transform
  license: MIT
  license_file: LICENSE
  summary: CLI tool for 3D Gaussian splat format conversion and transformation
