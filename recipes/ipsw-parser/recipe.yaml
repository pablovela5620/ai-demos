context:
  version: "1.9.2"

package:
  name: ipsw-parser
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/2c/7f/6785979fc22745f6c5f5ee552ef3d0d76a8344cf8129e97d6f6c390f38fb/ipsw_parser-1.9.2.tar.gz
  sha256: b9b6bcaab2b49691f6ff90aa6703a4e2be7e8ff8f85534e7ba65bb8565dd0db9

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - ipsw-parser = ipsw_parser.__main__:cli
  script: python -m pip install . --no-deps --no-build-isolation -v

requirements:
  host:
    - python 3.13.*
    - pip
    - setuptools >=43.0.0
    - setuptools-scm >=8
    - wheel
  run:
    - python >=3.13,<3.14
    - ansilogs >=1.1.0
    - bytestruct >=0.1.0
    - pyimg4 >=0.8.8
    - requests
    - remotezip2
    - typer

tests:
  - python:
      imports:
        - ipsw_parser
      python_version: 3.13.*
  - script:
      - ipsw-parser --help

about:
  homepage: https://pypi.org/project/ipsw-parser/
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: "python3 utility for parsing and extracting data from IPSW"
