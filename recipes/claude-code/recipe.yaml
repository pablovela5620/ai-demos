context:
  version: "2.1.247"

package:
  name: claude-code
  version: ${{ version }}

# The @anthropic-ai/claude-code npm package is only a thin wrapper whose
# postinstall downloads a platform-native binary from these per-platform npm
# packages. Repackage the native binary directly — no nodejs needed.
source:
  - if: target_platform == "osx-arm64"
    then:
      url: https://registry.npmjs.org/@anthropic-ai/claude-code-darwin-arm64/-/claude-code-darwin-arm64-${{ version }}.tgz
      sha256: ed87916671cd37b0dbf02329ddcc028a3bb618dc02ce5da0ca986cd0a534ea7d
  - if: target_platform == "linux-64"
    then:
      url: https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/-/claude-code-linux-x64-${{ version }}.tgz
      sha256: c6697aa74f8f6c0a1167fcf800ca976b34b89c0170dead133aead97b1ed18471
  - if: target_platform == "linux-aarch64"
    then:
      url: https://registry.npmjs.org/@anthropic-ai/claude-code-linux-arm64/-/claude-code-linux-arm64-${{ version }}.tgz
      sha256: 43384995766bbc35c7b9f5e034d3b010be20d3c4d70b69a1c7cc4fe29caee54b

build:
  number: 0
  script: build.sh
  dynamic_linking:
    binary_relocation: false
    missing_dso_allowlist:
      - "**"

requirements:
  run: []

tests:
  - package_contents:
      bin:
        - claude
      files:
        - etc/pixi/claude/global-ignore-conda-prefix
  - script:
      - claude --version

about:
  homepage: https://claude.com/claude-code
  repository: https://github.com/anthropics/claude-code
  license: LicenseRef-Anthropic-Commercial-Terms
  license_file: LICENSE.md
  summary: Claude Code - Anthropic agentic coding CLI
