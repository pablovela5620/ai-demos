context:
  version: "11.59.0"

package:
  name: pymobiledevice3
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/c3/c3/a4bd30c8dd557aef4b69f7447c730f4e736d3a222698a9651f2daa69af41/pymobiledevice3-11.59.0.tar.gz
  sha256: 884265706787e5b1802c344b8f9ccffaf09cd91413cb62db27070e97a542c26d
  patches:
    - verified-https-tss.patch

build:
  number: 0
  # First validated device host. Linux/Windows need separate dependency and device tests.
  skip: target_platform != "osx-arm64"
  python:
    entry_points:
      - pymobiledevice3 = pymobiledevice3.__main__:main
  script: python -m pip install . --no-deps --no-build-isolation -v

requirements:
  host:
    - python 3.13.*
    - pip
    - setuptools >=43.0.0
    - setuptools-scm >=8
    - wheel
  run:
    - python >=3.13,<3.14
    - asn1
    - ipython
    - bpylist2 >=4.0.1
    - pygments
    - daemonize
    - pykdebugparser >=1.10.0
    - rich >=13.0.0
    - ansilogs >=1.2.0
    - requests
    - packaging
    - typing_extensions >=4.1.0
    - pygnuutils >=0.0.7
    - cryptography >=43.0.0
    - pycrashreport >=2.0.0
    - fastapi >=0.93.0
    - uvicorn >=0.15.0
    - wsproto
    - pillow
    - questionary >=2.0.0
    - ipsw-parser >=1.9.0
    - ifaddr
    - hyperframe
    - qh3 <2,>=1.0.0
    - developer-disk-image >=0.3.0
    - opack2 >=0.2.0
    - psutil
    - pytun-pmd3 >=3.0.3
    - prompt_toolkit
    - python-pcapng >=2.1.1
    - pyimg4 >=0.8.8
    - pyiosbackup >=0.2.4
    - typer >=0.25
    - typer-injector >=0.3.0
    - defusedxml
    - bytestruct >=0.1.0
    - ioregistry >=0.0.6
    - pmd-pytcp >=0.3.9
    - pmd-net-addr
    - asgiwebdav >=2.0.1
    - backports.zstd

tests:
  - package_contents:
      bin:
        - pymobiledevice3
  - python:
      imports:
        - pymobiledevice3
      python_version: 3.13.*
  - script:
      - pymobiledevice3 --help
      - pymobiledevice3 developer core-device screen-capture screenshot --help
      - pymobiledevice3 developer core-device universal-hid-service tap --help

about:
  homepage: https://github.com/doronz88/pymobiledevice3
  documentation: https://doronz88.github.io/pymobiledevice3/
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: "Pure python3 implementation for working with iDevices (iPhone, etc...)"
  description: |
    Physical iOS device management, screenshots, and touch input.
    This initial recipe targets Apple Silicon macOS and Python 3.13.
    Device trust, Developer Mode, and developer-image setup are host/device
    prerequisites; the package does not change them during installation.
