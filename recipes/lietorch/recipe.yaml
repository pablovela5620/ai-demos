context:
  name: lietorch
  version: 1.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - git: https://github.com/VSLAM-LAB/lietorch
    rev: 3e2695ddedb6f234510da4f1519d9861e5a1cd8e

build:
  number: 2
  # Build for every CUDA variant in conda_build_config (12.9 + 13.0). The 12.9
  # build already exists on the channel (skip-existing); the 13.0 build is new
  # and unblocks the examples-monorepo CUDA 13 migration (dpvo, mast3r-slam).
  # cuda-version==${{ cuda_compiler_version }} below drives torch to the matching
  # cuda130/2.12 build for the 13.0 variant.
  skip: target_platform != "linux-64" or cuda_compiler == "None"

requirements:
  build:
    - ${{ compiler('cuda') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ninja
    - cmake
    - make
    - pkg-config

  host:
    # Exact-minor torch pin: libtorch's C++ ABI is not stable across minor
    # releases, and this recipe captures no libtorch run_export — an unpinned
    # host floats to the newest conda-forge pytorch (2.13 as of 2026-08) and
    # the resulting .so misbehaves under the 2.12 torch that examples-monorepo
    # (and the prebuilt gsplat, py312_torch212) actually run. Bump this
    # together with the monorepo torch pin.
    - pytorch-gpu 2.12.*
    - cuda-version==${{ cuda_compiler_version }}
    - cuda-cudart-dev
    - cuda-crt
    - cudnn
    - libcusparse-dev
    - cuda-driver-dev
    - cuda-nvcc
    - cuda-nvrtc-dev
    - cuda-nvtx-dev
    - cuda-nvml-dev
    - cuda-profiler-api
    - cusparselt
    - libcublas-dev
    - libcufile-dev
    - libcufft-dev
    - libcurand-dev
    - libcusolver-dev
    - pip
    - python=3.11
    - setuptools
    - eigen
  run:
    - python=3.11
    # Keep in lockstep with the host pin above (ABI, see comment there).
    - pytorch-gpu 2.12.*
    - scipy
    - pyyaml

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: The LieTorch library generalizes PyTorch to 3D transformation groups.
  description: |
    The LieTorch library generalizes PyTorch to 3D transformation groups. Just as torch.Tensor is a multi-dimensional matrix of scalar elements, lietorch.SE3 is a multi-dimensional matrix of SE3 elements. We support common tensor manipulations such as indexing, reshaping, and broadcasting. Group operations can be composed into computation graphs and backpropagation is automatically peformed in the tangent space of each element. For more details, please see our paper: Tangent Space Backpropagation for 3D Transformation Groups Zachary Teed and Jia Deng, CVPR 2021
  homepage: https://github.com/princeton-vl/lietorch
  
extra:
  authors:
    - Zachary Teed
    - Jia Deng
  recipe-maintainers:
    - fontan
