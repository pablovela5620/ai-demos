context:
  version: "0.38.1"
  release: https://github.com/pablovela5620/ai-demos/releases/download/rerun-sdk-0.38.1-av1arm64-wheels

package:
  name: rerun-sdk
  version: ${{ version }}

source:
  - url: ${{ release }}/rerun_sdk-${{ version }}-cp310-abi3-manylinux_2_17_aarch64.manylinux2014_aarch64.whl
    sha256: 8d5ee9b10e0ce5da43b79d9ca25bce90271f2dcbbdb98b20d5f59760bc0c6795
    file_name: rerun_sdk-${{ version }}-cp310-abi3-manylinux_2_17_aarch64.manylinux2014_aarch64.whl
  - url: ${{ release }}/rerun_notebook-${{ version }}-py2.py3-none-any.whl
    sha256: b475af14dfa2bb66a5839ae6cbd98fb51b4c554f2e4913598fd19655e6afb849
    file_name: rerun_notebook-${{ version }}-py2.py3-none-any.whl
  - url: ${{ release }}/LICENSE-MIT
    sha256: 7d3db59468f92d70f176170deacf8ac6858b6d78010a30ae01eba42bac302940
  - url: ${{ release }}/LICENSE-APACHE
    sha256: 8173d5c29b4f956d532781d2b86e4e30f83e6b7878dce18c919451d6ba707c90
  - url: ${{ release }}/THIRDPARTY.yml
    sha256: 7d0872c94e63ef2de64bed1e5cdfd4f5565e445baa82fe84f40595e739dbe8df

build:
  number: 0
  string: av1arm64_h${{ hash }}_${{ build_number }}
  skip: target_platform != "linux-aarch64"
  script: build.sh
  python:
    version_independent: true
    entry_points:
      - rerun = rerun_cli.__main__:main

requirements:
  host:
    - python 3.10.*
    - python-abi3 3.10.*
    - python-installer
  run:
    - python >=3.10
    - __glibc >=2.17
    - libgcc >=13
    - libudev1 >=257.13
    - attrs >=23.1.0
    - anywidget
    - jupyter-ui-poll
    - ipykernel !=7.0.*
    - numpy >=2
    - pillow >=8.0.0
    - psutil >=7.0
    - pyarrow >=18.0.0
    - typing_extensions >=4.5

tests:
  - python:
      imports:
        - rerun
        - rerun_bindings
        - rerun_notebook
      python_version: "3.10.*"
  - script:
      - rerun --version
      - rerun --version | grep 'Video features:.*av1'
      - rerun viewer-mcp --help
      - python -c "import rerun; assert rerun.__version__ == '0.38.1'"

about:
  homepage: https://rerun.io
  repository: https://github.com/rerun-io/rerun
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
    - THIRDPARTY.yml
  summary: Rerun SDK and viewer with native AV1 decoding on Linux ARM64
  description: |
    Packages verified wheels built from 0.38.1 source with the native AV1
    ARM64 fix for rerun-io/rerun#7755. Includes the Python SDK, native viewer,
    web viewer, and notebook integration. The source rebuild recipe is kept
    in .github/rerun-source-build. Remove this stopgap once a released
    upstream version supports native AV1 on Linux ARM64.
